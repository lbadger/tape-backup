name: Tests and standalone binary

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server tar
          sudo install -d -m 0755 /run/sshd
      - name: Build portable executable
        run: ./build.sh
      - name: Test source, simulator, SSH, and executable
        run: TAPE_BACKUP_BINARY="$PWD/dist/tape-backup" python3 -m unittest discover -s tests -v
      - name: Test without an installed Python runtime
        run: >-
          docker run --rm --network none
          -v "$PWD/dist:/opt/tape-backup:ro"
          -v "$PWD/tests/binary_smoke.sh:/smoke.sh:ro"
          debian:bullseye-slim sh /smoke.sh
      - name: Verify checksum
        working-directory: dist
        run: sha256sum --check tape-backup.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tape-backup-linux-x86_64
          path: dist/tape-backup*

  zfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install OpenZFS
        run: |
          sudo apt-get update
          sudo apt-get install -y zfsutils-linux openssh-server
          sudo install -d -m 0755 /run/sshd
          sudo modprobe zfs
      - name: Create a dedicated file-backed scratch pool
        run: |
          truncate -s 3G "$RUNNER_TEMP/tape-backup-zfs.vdev"
          sudo zpool create -m none tape_backup_ci "$RUNNER_TEMP/tape-backup-zfs.vdev"
      - name: Build standalone executable for native ZFS testing
        run: ./build.sh
      - name: Test native full, incremental, and encrypted raw receive
        run: sudo env TAPE_BACKUP_ZFS_TEST_POOL=tape_backup_ci TAPE_BACKUP_BINARY="$PWD/dist/tape-backup" python3 -m unittest discover -s tests -p test_zfs.py -v
      - name: Destroy the scratch pool
        if: always()
        run: sudo zpool destroy tape_backup_ci || true
